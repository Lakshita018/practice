<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Store</title>
    <link rel="stylesheet" href="cloth.css">
</head>
<body>
    <header>
        <h1>Fashion Hub</h1>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#products">Shop</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    
    <section class="hero" id="home">
        <h2>Style that speaks for you</h2>
        <p>Trendy and comfortable clothing for everyone.</p>
        <a href="#products" class="btn">Shop Now</a>
    </section>
    
    <section class="products" id="products">
        <h2>Our Collection</h2>
        <div class="product-grid">
            <div class="product-card">
                <img src="shirt.jpg" alt="Stylish Shirt">
                <div class="card-content">
                    <h3>Stylish Shirt</h3>
                    <p>$25.99</p>
                    <button class="btn">Buy Now , you can</button>
                </div>
            </div>
            <div class="product-card">
                <img src="jeans.jpg" alt="Trendy Jeans">
                <div class="card-content">
                    <h3>Trendy Jeans</h3>
                    <p>$40.99</p>
                    <button class="btn">Buy Now</button>
                </div>
            </div>
            <div class="product-card">
                <img src="jacket.jpg" alt="Cool Jacket">
                <div class="card-content">
                    <h3>Cool Jacket</h3>
                    <p>$55.99</p>
                    <button class="btn">Buy Now</button>
                </div>
            </div>
        </div>
    </section>
    
    <footer>
        <p>&copy; 2025 Fashion Hub. All Rights Reserved.</p>
    </footer>
</body>
</html>
